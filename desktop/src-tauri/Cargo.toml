[package]
name = "leve-desktop"
version = "0.1.0"
description = "Leve — compressor de vídeo com aceleração de hardware (uso interno)"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "io-util", "macros"] }
rfd = { version = "0.15", default-features = false, features = ["gtk3"] }
